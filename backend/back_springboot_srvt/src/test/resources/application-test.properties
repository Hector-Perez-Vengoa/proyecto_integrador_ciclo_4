# Test Configuration

# In-memory H2 Database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Test Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Test Configuration
jwt.secret=testSecretKey
jwt.expiration=86400000

# Personal Access Token Test Configuration
app.pat.max-tokens-per-user=10
app.pat.default-expiration-days=365
app.pat.token-length=40

# Disable banner for cleaner test output
spring.main.banner-mode=off

# Logging configuration for tests
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.tecsup=DEBUG